<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hero Core</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        background: #000;
        overflow-x: hidden;
        overflow-y: auto;
      }

      /* ------------------------------------------------ */
      /* 🌌 HERO ROOT                                     */
      /* ------------------------------------------------ */

      #hero-root {
        position: relative;

        width: 100%;
        min-height: 100vh;

        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="hero-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
